<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diary Coder">
  <meta name="description" content="Локальное шифрование личных дневниковых записей.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Diary Coder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" id="app">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">📖</div>
      <div>
        <h1>Diary Coder</h1>
        <p>Только ты можешь прочитать свои записи.</p>
      </div>
    </header>

    <div class="segmented-control" role="tablist" aria-label="Режим работы">
      <button class="segment is-active" id="tab-encrypt" type="button" role="tab" aria-selected="true" aria-controls="panel-encrypt" data-mode="encrypt">
        <span aria-hidden="true">🔒</span> Шифрование
      </button>
      <button class="segment" id="tab-decrypt" type="button" role="tab" aria-selected="false" aria-controls="panel-decrypt" data-mode="decrypt">
        <span aria-hidden="true">🔓</span> Расшифровка
      </button>
    </div>

    <section class="mode-panel is-active" id="panel-encrypt" role="tabpanel" aria-labelledby="tab-encrypt">
      <div class="card stack">
        <div class="field-group">
          <label for="encrypt-password">Пароль</label>
          <div class="password-wrap">
            <input id="encrypt-password" class="text-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" aria-describedby="encrypt-password-hint">
            <button class="icon-button password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-target="encrypt-password">👁</button>
          </div>
          <p class="field-hint" id="encrypt-password-hint">Пароль нигде не сохраняется.</p>
        </div>

        <div class="field-group grow-field">
          <label for="plain-text">Моя запись</label>
          <textarea id="plain-text" class="textarea textarea-large" placeholder="Какая мысль хочет быть услышанной?" spellcheck="true"></textarea>
        </div>

        <button class="button button-primary button-main" id="encrypt-button" type="button">🔒 Зашифровать</button>
        <div class="status" id="encrypt-status" role="status" aria-live="polite"></div>
      </div>

      <div class="card result-card" id="encrypt-result" hidden>
        <div class="field-group">
          <label for="protected-output">Защищённая запись</label>
          <textarea id="protected-output" class="textarea textarea-protected" readonly spellcheck="false" autocapitalize="none"></textarea>
        </div>
        <div class="button-row">
          <button class="button button-secondary" id="copy-notion-button" type="button">📝 Скопировать для Notion</button>
          <button class="button button-secondary button-danger-soft" id="clear-encrypt-button" type="button">🗑 Очистить</button>
        </div>
      </div>
    </section>

    <section class="mode-panel" id="panel-decrypt" role="tabpanel" aria-labelledby="tab-decrypt" hidden>
      <div class="card stack">
        <div class="field-group">
          <label for="decrypt-password">Пароль</label>
          <div class="password-wrap">
            <input id="decrypt-password" class="text-input" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none">
            <button class="icon-button password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-target="decrypt-password">👁</button>
          </div>
        </div>

        <div class="field-group">
          <label for="protected-input">Защищённая запись</label>
          <textarea id="protected-input" class="textarea textarea-protected-input" placeholder="Вставьте защищённую запись из Notion" spellcheck="false" autocapitalize="none"></textarea>
        </div>

        <button class="button button-primary button-main" id="decrypt-button" type="button">🔓 Расшифровать</button>
        <div class="status" id="decrypt-status" role="status" aria-live="polite"></div>
      </div>

      <div class="card result-card" id="decrypt-result" hidden>
        <div class="field-group">
          <label for="decrypted-output">Расшифрованная запись</label>
          <textarea id="decrypted-output" class="textarea textarea-large" readonly></textarea>
        </div>
        <div class="button-row single-action">
          <button class="button button-secondary button-danger-soft" id="clear-decrypt-button" type="button">🗑 Очистить</button>
        </div>
      </div>
    </section>

    <footer class="privacy-note">🔒 Шифрование и расшифровка выполняются локально на этом устройстве.</footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
